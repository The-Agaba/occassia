<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/new-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Occassia - Modern Wedding & Event Guest Management Platform</title>
    <meta name="description" content="Occassia is a comprehensive wedding and events guest management platform. Streamline check-ins, track live attendance, manage guest lists, and optimize event operations with our modern, intuitive system." />
    <meta name="keywords" content="wedding guest management, event check-in, event management platform, guest tracking, wedding events, event operations, RSVP management, guest list management, Occassia, Cotronix, event technology" />
    <meta name="author" content="Cotronix" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0c0f14" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://occassia.com/" />
    <meta property="og:title" content="Occassia - Modern Wedding & Event Guest Management Platform" />
    <meta property="og:description" content="Streamline your event operations with Occassia. Seamless check-ins, live attendance tracking, and comprehensive guest management for weddings and events of every scale." />
    <meta property="og:image" content="/new-favicon.svg" />
    <meta property="og:site_name" content="Occassia" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://occassia.com/" />
    <meta property="twitter:title" content="Occassia - Modern Wedding & Event Guest Management Platform" />
    <meta property="twitter:description" content="Streamline your event operations with Occassia. Seamless check-ins, live attendance tracking, and comprehensive guest management." />
    <meta property="twitter:image" content="/new-favicon.svg" />
    
    <!-- Additional SEO -->
    <link rel="canonical" href="https://occassia.com/" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Occassia",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Comprehensive wedding and events guest management platform with seamless check-ins, live attendance tracking, and guest list management.",
      "author": {
        "@type": "Organization",
        "name": "Cotronix"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "150"
      }
    }
    </script>
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
    
    <!-- Additional Performance Optimizations -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/new-favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
