name: Keep Render API warm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL secret is not configured"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 25 "$HEALTH_URL"
